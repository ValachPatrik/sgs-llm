- id: swisstopo-parzelle-belp-de
  lang: de
  category: swisstopo_feedback
  question: Zeige mir die Parzelle 20
  history:
    - role: user
      content: Zeige mir den Katasterplan der Gemeinde Belp
    - role: assistant
      content: >-
        Der amtliche Katasterplan (CadastralWebMap) deckt die Gemeinde Belp ab. Sie können
        ihn als amtliche Kartenebene hinzufügen.
  user_intent: >-
    Measured: geocode_location with origins ["parcel"] returns two genuine parcels named
    "Belp 20", with different EGRIDs. Two real candidates and nothing to choose between
    them is the case where asking is right, so a good answer lists them and asks - it
    must not silently pick one or invent a third.
  expect:
    must_clarify: true
    no_layer: true
    must_not_fail_tools: true
    answer_lang: de
    must_mention: [EGRID]

- id: swisstopo-parzelle-egrid-de
  lang: de
  category: swisstopo_feedback
  question: Zeige mir die Parzelle mit EGRID CH 3435 4679 1597
  user_intent: >-
    The report said "If I use EGRID numbers, hallucinations explode". Measured against
    the live SearchServer, that is a data-shape bug rather than a model one:
    CH343546791597 returns the Belp 20 parcel, CH 3435 4679 1597 returns nothing - and
    the spaced form is exactly what the tools print in their own labels, so a model
    copying it back gets zero hits and has nothing left to answer from. The question
    deliberately uses the spaced form a user would paste. A good answer resolves the
    parcel and shows its polygon.
  expect:
    must_produce_layer: true
    must_not_fail_tools: true
    answer_lang: de
    must_mention: [Belp]

