- id: swisstopo-gebaeude-belp-de
  lang: de
  category: swisstopo_feedback
  question: Wie viele Gebäude gibt es?
  history:
    - role: user
      content: Zeige mir die Gemeindegrenzen von Belp
    - role: assistant
      content: Hier ist die Gemeindegrenze von Belp.
  user_intent: >-
    The exact case behind the phantom button. The answer counted 481 buildings and told
    the user to press "Show result on map", which did not exist because display_layer was
    never called - and quoted the English label into a German answer.
  expect:
    must_chain_tools: [filter_features, analyze_features, display_layer]
    must_produce_layer: true
    must_not_fail_tools: true
    answer_lang: de
    must_not_contain: ["Show result on map", "Ergebnis auf Karte anzeigen"]

