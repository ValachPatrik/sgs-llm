  user_intent: >-
    A parcel answer is the parcel polygon. The report said it alternated between a
    geocoded point and the real parcel from OpenData-AV, which is a determinism problem
    rather than a capability one.
  expect:
    must_produce_layer: true
    must_not_fail_tools: true
    answer_lang: de
    must_mention: ["20"]

