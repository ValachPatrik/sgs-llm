# swisstopo test round 1, 2026-09-08 (260908_TestResults.docx).
#
# Kept out of questions.yaml on purpose: that file's sha256 gates run comparability, so
# folding customer regression cases into it would invalidate every stored baseline.
#
# Each `expect` encodes what the report said was wrong, so a pass here means the reported
# behaviour is gone - not that the answer is merely plausible. Where a finding is
# Ageospatial's, the case is written to the correct answer anyway and is expected to fail
# until their fix lands; that is the point of it.
#
# Run:
#   python evals/run.py --questions evals/swisstopo-feedback.yaml \
#     --mcp-url http://127.0.0.1:8790/mcp --model <id> --region <region>
#
# The production tool surface is required. Against mcp_dummy these measure a smaller tool
# set than the deployment has (docs/evals.md).

- id: swisstopo-parks-bern-en
  lang: en
  category: swisstopo_feedback
  question: Show me all regional natural parks in the canton Bern
  user_intent: >-
    Wants every regional nature park intersecting canton Bern, as whole objects, on the
    map. Ground truth from Manuel's QGIS selection of
    ch.bafu.schutzgebiete-paerke_nationaler_bedeutung against SWISSBOUNDARIES3D is 8. The
    report said Sonnet returned 6 with geometric artifacts. Nine candidates are fetched;
    geosearch's clip() drops three and keeps two hairline fragments, so this case fails
    until that is fixed on the MCP side and is the detector for it.
  expect:
    must_chain_tools: [search_locations, search_layers, filter_features, display_layer]
    must_produce_layer: true
    must_not_fail_tools: true
    answer_lang: en
    must_mention: ["8"]

- id: swisstopo-wanderwegsperrungen-be-de
  lang: de
  category: swisstopo_feedback
  question: Zeige mir die Wanderwegsperrungen im Kanton Bern
  user_intent: >-
    The report said Sonnet and Ministral were both OK here. This is the floor, and it must
    stay OK - a prompt change that buys Q7 at the cost of this one is not an improvement.
  expect:
    must_call_tool: [filter_features]
    must_produce_layer: true
    must_not_fail_tools: true
    answer_lang: de

- id: swisstopo-bushaltestellen-stadt-bern-de
  lang: de
  category: swisstopo_feedback
  question: Zeige mir alle Bushaltestellen in der Stadt Bern
  user_intent: >-
    "Stadt Bern" is the commune, not the canton. The report said Ministral could not find
    the city boundary, fell back to the canton, and returned every stop in canton Bern.
    The administrative word has to become place_kind rather than part of the name.
  expect:
    must_call_tool: [filter_features]
    must_produce_layer: true
    must_not_fail_tools: true
    answer_lang: de
    must_mention: [Bern]
    must_not_contain: [Kanton Bern]

- id: swisstopo-unesco-bern-de
  lang: de
  category: swisstopo_feedback
  question: Zeige mir alle UNESCO Welterbe Kulturstätten in Bern
  user_intent: >-
    "in Bern" is genuinely ambiguous between the canton and the city. The report asked for
    this to be a question rather than a silent choice of the canton, which is what the
    tool does when place_kind is omitted.
  expect:
    must_clarify: true
    no_layer: true
    answer_lang: de

- id: swisstopo-chasseral-fr
