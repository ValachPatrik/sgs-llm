- id: swisstopo-denivele-schwarzsee-fr
  lang: fr
  category: swisstopo_feedback
  question: Tu peux montrer les dénivelés ?
  history:
    - role: user
      content: Affiche les itinéraires de randonnée dans la région de Schwarzsee
    - role: assistant
      content: Voici les itinéraires de randonnée dans la région du Schwarzsee.
  user_intent: >-
    There is no elevation-profile tool in the catalogue, though geo.admin.ch's
    profile.json exists. Until Ageospatial adds one, the only correct answer is to say so
    plainly and offer what it can, without inventing ascent or descent figures. Judged
    rather than rule-checked: "declined honestly and invented nothing" is a matter of
    degree, and `no_layer` cannot express it here because search_layers legitimately
    offers official layers to click. This case flips to must_call_tool once the tool
    exists.
  expect:
    must_not_fail_tools: true
    answer_lang: fr
    judge: true

# Counter-cases for the disambiguation rule. Without these, a prompt that asks "canton or
# commune?" about everything would score well on swisstopo-unesco-bern-de while being
# useless - over-asking is a tracked failure mode with its own stage (docs/evals.md).

- id: swisstopo-no-overclarify-kanton-de
  lang: de
  category: swisstopo_feedback
  question: Zeige mir alle UNESCO Welterbe Kulturstätten im Kanton Bern
  user_intent: >-
    The request says which level it means. Asking here is the over-clarification failure,
    not restraint.
  expect:
    must_not_clarify: true
    must_call_tool: [filter_features]
    answer_lang: de

- id: swisstopo-no-overclarify-stadt-de
  lang: de
  category: swisstopo_feedback
  question: Zeige mir alle UNESCO Welterbe Kulturstätten in der Stadt Bern
  user_intent: >-
    Also says which, at the other level, and exercises stripping "Stadt" into place_kind
    rather than passing it as part of the name.
  expect:
    must_not_clarify: true
    must_call_tool: [filter_features]
    answer_lang: de
