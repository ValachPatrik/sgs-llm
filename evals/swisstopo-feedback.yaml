- id: swisstopo-bushaltestellen-stadt-bern-de
  lang: de
  category: swisstopo_feedback
  question: Zeige mir alle Bushaltestellen in der Stadt Bern
  user_intent: >-
    "Stadt Bern" is the commune, not the canton. The report said Ministral could not find
    the city boundary, fell back to the canton, and returned every stop in canton Bern.
    The administrative word has to become place_kind rather than part of the name.
    Measured against the live server for scale: ch.bav.haltestellen-oev returns 818
    features for place_kind gemeinde and 7892 for kanton, so a canton fallback is an
    order of magnitude out.
  expect:
    must_call_tool: [filter_features]
    must_produce_layer: true
    must_not_fail_tools: true
    answer_lang: de
    # Not must_not_contain: [Kanton Bern] - the disambiguation rule now requires the
    # answer to name the level it used and offer the other, so that phrase is expected.
    # This asserts the level named is the commune.
    must_mention: ["Gemeinde Bern"]

- id: swisstopo-unesco-bern-de
  lang: de
  category: swisstopo_feedback
  question: Zeige mir alle UNESCO Welterbe Kulturstätten in Bern
  user_intent: >-
    "in Bern" reads as either the canton or the city, and the report asked for the silent
    choice of the canton to stop. A good answer takes the likelier reading - the city -
    names the level it used ("in der Gemeinde Bern") and offers the other one. Asking is
    only right where neither reading is more likely, which is not the case here, so this
    is judged rather than rule-checked: "did it name the level" is a matter of degree.
  expect:
    must_produce_layer: true
    must_not_fail_tools: true
    answer_lang: de
    judge: true

